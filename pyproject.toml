[project]
name = "phi-deidentification-bert"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hiroyuki Shindo", email = "hshindo@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "numpy>=2.5.2",
    "omegaconf>=2.3.1",
    "scikit-learn>=1.9.0",
    "seqeval>=1.2.2",
